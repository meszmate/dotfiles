# Keybinds (prefix is Ctrl+A, set in tmux.conf). Every bind carries a note
# "Section · What it does" — that is what `prefix + ?` (bin/keybinds tmux)
# renders as the cheatsheet, and what `tmux list-keys -N` prints. Plugin binds
# (sessionx, floax, thumbs, fzf-url, …) are recognised by the cheatsheet itself.

# Sessions --------------------------------------------------------------------
bind -N "Sessions · Detach"                        ^D detach
bind -N "Sessions · Detach"                        d  detach
bind -N "Sessions · Choose session"                S  choose-session
bind -N "Sessions · Rename session"                $  command-prompt -I "#S" { rename-session "%%" }
bind -N "Sessions · Lock"                          ^X lock-server

# Windows ---------------------------------------------------------------------
bind -N "Windows · New window"                     ^C new-window -c "$HOME"
bind -N "Windows · Last window"                    ^A last-window
bind -N "Windows · Previous window"                H  previous-window
bind -N "Windows · Next window"                    L  next-window
bind -N "Windows · Next window"                    n  next-window
bind -N "Windows · Window 1"                       1  select-window -t :=1
bind -N "Windows · Window 2"                       2  select-window -t :=2
bind -N "Windows · Window 3"                       3  select-window -t :=3
bind -N "Windows · Window 4"                       4  select-window -t :=4
bind -N "Windows · Window 5"                       5  select-window -t :=5
bind -N "Windows · Window 6"                       6  select-window -t :=6
bind -N "Windows · Window 7"                       7  select-window -t :=7
bind -N "Windows · Window 8"                       8  select-window -t :=8
bind -N "Windows · Window 9"                       9  select-window -t :=9
bind -N "Windows · Choose window"                  '"' choose-window
bind -N "Windows · List windows"                   w  list-windows
bind -N "Windows · List windows"                   ^W list-windows
bind -N "Windows · Rename window"                  r  command-prompt "rename-window %%"
bind -N "Windows · Kill window"                    &  confirm-before -p "kill-window #W? (y/n)" kill-window
bind -N "Windows · Find window"                    f  command-prompt "find-window -Z -- '%%'"

# Panes -----------------------------------------------------------------------
bind -N "Panes · Split below"                      s  split-window -v -c "#{pane_current_path}"
bind -N "Panes · Split right"                      v  split-window -h -c "#{pane_current_path}"
bind -N "Panes · Split below"                      |  split-window
bind -N "Panes · Focus pane left"                  h  select-pane -L
bind -N "Panes · Focus pane down"                  j  select-pane -D
bind -N "Panes · Focus pane up"                    k  select-pane -U
bind -N "Panes · Focus pane right"                 l  select-pane -R
bind -N "Panes · Resize left"                   -r ,  resize-pane -L 20
bind -N "Panes · Resize right"                  -r .  resize-pane -R 20
bind -N "Panes · Resize down"                   -r -  resize-pane -D 7
bind -N "Panes · Resize up"                     -r =  resize-pane -U 7
bind -N "Panes · Zoom pane"                        z  resize-pane -Z
bind -N "Panes · Swap with next pane"              x  swap-pane -D
bind -N "Panes · Break pane into a window"         !  break-pane
bind -N "Panes · Show pane numbers"                q  display-panes
bind -N "Panes · Kill pane"                        c  kill-pane
bind -N "Panes · Sync input to all panes"          *  setw synchronize-panes

# Copy & paste ------------------------------------------------------------------
bind -N "Copy & paste · Copy mode (vi keys)"       [  copy-mode
bind -N "Copy & paste · Paste"                     ]  paste-buffer -p
bind -N "Copy & paste · List paste buffers"        '#' list-buffers
bind -T copy-mode-vi -N "Copy & paste · Start selection" v send-keys -X begin-selection

# Misc ------------------------------------------------------------------------
bind -N "Misc · Command prompt"                    :  command-prompt
bind -N "Misc · Reload config"                     R  source-file ~/.config/tmux/tmux.conf
bind -N "Misc · Clear screen"                      K  send-keys "clear"\; send-keys "Enter"
bind -N "Misc · Redraw"                            ^L refresh-client
bind -N "Misc · Clock"                             t  clock-mode
