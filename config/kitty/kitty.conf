include ./mocha.conf

# ---- font ------------------------------------------------------------------
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13
disable_ligatures never

# ---- window ----------------------------------------------------------------
background_opacity        0.95
window_padding_width      12
hide_window_decorations   yes
confirm_os_window_close   0
remember_window_size      no
initial_window_width      120c
initial_window_height     34c
enable_audio_bell         no
visual_bell_duration      0
cursor_shape              block
cursor_blink_interval     0
mouse_hide_wait           2.0
url_style                 curly
detect_urls               yes
scrollback_lines          20000
scrollback_pager_history_size 20
copy_on_select            clipboard
strip_trailing_spaces     smart
paste_actions             quote-urls-at-prompt,confirm

# ---- tabs (only visible with 2+ tabs) ---------------------------------------
tab_bar_style             powerline
tab_powerline_style       slanted
tab_bar_min_tabs          2
tab_title_template        {index}: {title}

# ---- shell integration & notifications --------------------------------------
shell_integration         enabled
# Desktop notification when a command that ran > 20s finishes in a window you
# are not looking at — handy while an agent/build works in the background.
notify_on_cmd_finish      invisible 20.0 notify
allow_remote_control      socket-only
listen_on                 unix:@kitty

# ---- keys ------------------------------------------------------------------
map ctrl+shift+equal   change_font_size all +1.0
map ctrl+shift+minus   change_font_size all -1.0
map ctrl+shift+0       change_font_size all 0
map ctrl+shift+t       new_tab_with_cwd
map ctrl+shift+enter   new_window_with_cwd
map ctrl+shift+f       show_scrollback
map ctrl+shift+u       open_url_with_hints
