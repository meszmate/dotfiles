# hyprpaper — wallpaper.current is a symlink (gitignored) that the wallpaper
# picker (SUPER+SHIFT+W) repoints; it defaults to wallpaper.jpg.
# https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/

splash = false

wallpaper {
    monitor =
    path = ~/.config/hypr/wallpaper.current
    fit_mode = cover
}
