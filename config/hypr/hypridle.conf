# hypridle — dim → lock → screen off → (on battery) suspend
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
#
# Every action goes through `idle run <action>` (bin/idle), which drops it when
# the current idle mode has that action switched off — so `idle awake`,
# `idle presentation` and the per-action toggles take effect immediately,
# without regenerating this file or restarting hypridle.
#
# The four timeouts below are the only thing to edit here. After changing one:
#   idle reload            (= systemctl --user restart hypridle)

$DIM_TIMEOUT       = 300     # 5 min  — dim the screen
$LOCK_TIMEOUT      = 600     # 10 min — lock
$SCREENOFF_TIMEOUT = 900     # 15 min — displays off
$SUSPEND_TIMEOUT   = 1800    # 30 min — suspend (on battery only)

$idle = ~/.local/bin/idle run

general {
    lock_cmd         = ~/.config/hypr/scripts/lock                       # locks unless already locked; clears stale instances
    before_sleep_cmd = loginctl lock-session                            # lock before suspend
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' # screen on after resume
    inhibit_sleep    = 3                                                # wait for the lock before sleeping
}

# dim the screen (restored on activity)
listener {
    timeout    = $DIM_TIMEOUT
    on-timeout = $idle dim
    on-resume  = $idle undim
}

# lock
listener {
    timeout    = $LOCK_TIMEOUT
    on-timeout = $idle lock
}

# displays off
listener {
    timeout    = $SCREENOFF_TIMEOUT
    on-timeout = $idle screenoff
    on-resume  = $idle screenon
}

# suspend — only when running on battery, so long jobs on AC survive
listener {
    timeout         = $SUSPEND_TIMEOUT
    on-timeout      = $idle suspend
    condition_cmd   = ~/.config/hypr/scripts/on-battery
    condition_retry = 300
}
