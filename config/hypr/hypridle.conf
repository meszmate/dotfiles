# hypridle — dim → lock → screen off → (on battery) suspend
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd         = ~/.config/hypr/scripts/lock                       # locks unless already locked; clears stale instances
    before_sleep_cmd = loginctl lock-session                            # lock before suspend
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' # screen on after resume
    inhibit_sleep    = 3                                                # wait for the lock before sleeping
}

# 5 min: dim the screen (restored on activity)
listener {
    timeout    = 300
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# 10 min: lock
listener {
    timeout    = 600
    on-timeout = loginctl lock-session
}

# 15 min: displays off
listener {
    timeout    = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 30 min: suspend — only when running on battery, so long jobs on AC survive
listener {
    timeout         = 1800
    on-timeout      = systemctl suspend
    condition_cmd   = ~/.config/hypr/scripts/on-battery
    condition_retry = 300
}
