# hyprlock — Catppuccin Mocha, matching the rest of the setup

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    vibrancy = 0.1696
}

# Time
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    color = rgb(cdd6f4)
    position = 0, 200
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    color = rgb(a6adc8)
    position = 0, 100
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 60
    rounding = 12
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgb(cba6f7)
    inner_color = rgb(1e1e2e)
    font_color = rgb(cdd6f4)
    check_color = rgb(f9e2af)
    fail_color = rgb(f38ba8)
    placeholder_text = <i>Password...</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fade_on_empty = true
    position = 0, -80
    halign = center
    valign = center
}
