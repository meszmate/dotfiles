# hyprlock — login-screen style lock (same wallpaper as the desktop / SDDM)
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
#
#   ┌ clock + date (top-left)                        ┐
#   │              ┌──────── HUD ─────────┐          │
#   │              │          󰌾           │          │
#   │              │      L O C K E D     │          │
#   │              │   [ ▌ enter password ]          │
#   │              │  user@host · layout  │          │
#   │              └─────────────────────┘          │
#   └ battery · network · host        ♫ now playing ┘
#
# Wrong password → "hacker mode" for ~5 s (scripts/lock-fx): the wallpaper
# crossfades to a red scan-lined copy, ACCESS DENIED glitch-decodes above the
# card, an intrusion log types out bottom-left, a hex stream runs bottom-right,
# the field turns red. Idle cost is one tiny poll every 200 ms.

$font     = Inter
$mono     = JetBrainsMono Nerd Font
$scripts  = $HOME/.config/hypr/scripts

# Catppuccin Mocha
$base     = rgb(1e1e2e)
$surface0 = rgb(313244)
$surface1 = rgb(45475a)
$text     = rgb(cdd6f4)
$subtext  = rgb(a6adc8)
$overlay  = rgb(6c7086)
$mauve    = rgb(cba6f7)
$blue     = rgb(89b4fa)
$lavender = rgb(b4befe)
$yellow   = rgb(f9e2af)
$red      = rgb(f38ba8)
$green    = rgb(a6e3a1)

general {
    hide_cursor        = false
    ignore_empty_input = true   # Enter on an empty field is not a failed attempt
    immediate_render   = true   # draw the UI right away, no black flash
    fail_timeout       = 2500   # ms the field stays red after a wrong password
}

auth {
    pam:enabled = true
    # fingerprint:enabled = true   # uncomment on machines with fprintd
}

# No fade-in/out, no input-field animations: locking, typing and unlocking are
# instant. (The failed-attempt effects are driven by scripts/lock-fx, not by
# these animations.)
animations {
    enabled = false
}

# ── background ───────────────────────────────────────────────────────────────
# scripts/lock-fx prepare renders two copies of the wallpaper into
# ~/.cache/hyprlock: wall.jpg (soft blur, darker) and alarm.jpg (red, scan lines).
# They are swapped with a crossfade on SIGUSR2 by lock-fx; blur is baked into
# the images so both states look consistent (hyprlock re-blurs badly on reload).
background {
    monitor =
    path = $HOME/.cache/hyprlock/wall.jpg
    color = $base
    blur_passes = 0
    reload_time    = 0                          # re-evaluate on SIGUSR2 (sent by lock-fx)
    reload_cmd     = $scripts/lock-fx background
    crossfade_time = -1                         # hard cut (animations are off anyway)
}

# ── clock (top-left) ─────────────────────────────────────────────────────────
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 84
    font_family = $mono
    shadow_passes = 2
    shadow_size = 4
    position = 56, -36
    halign = left
    valign = top
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $subtext
    font_size = 20
    font_family = $font
    shadow_passes = 1
    position = 60, -158
    halign = left
    valign = top
}

# ── center HUD ───────────────────────────────────────────────────────────────
# panel
shape {
    monitor =
    size = 560, 300
    color = rgba(17, 17, 27, 0.62)
    rounding = 14
    border_size = 1
    border_color = rgba(203, 166, 247, 0.35)
    shadow_passes = 2
    shadow_size = 8
    position = 0, 88
    halign = center
    valign = center
    zindex = 0
}

# big state glyph: 󰌾 locked · 󰀦 wrong password (lock-fx also polls $ATTEMPTS here)
label {
    monitor =
    text = cmd[update:200] $scripts/lock-fx avatar $ATTEMPTS
    color = $mauve
    font_size = 54
    font_family = $mono
    position = 0, 186
    halign = center
    valign = center
    zindex = 2
}

# state word: L O C K E D → glitch-decodes into ACCESS DENIED after a wrong password
label {
    monitor =
    text = cmd[update:0:1] $scripts/lock-fx center
    color = $text
    font_size = 24
    font_family = $mono
    text_align = center
    position = 0, 112
    halign = center
    valign = center
    zindex = 2
}

# password
input-field {
    monitor =
    size = 400, 54
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.28
    dots_center = true
    rounding = 10
    outer_color = $mauve
    inner_color = rgba(17, 17, 27, 0.9)
    font_color = $text
    font_family = $mono
    fade_on_empty = false
    placeholder_text = <span foreground="##6c7086">▌ enter password</span>
    check_color = rgb(f9e2af) rgb(fab387) 30deg
    check_text = <span foreground="##f9e2af">▌ VERIFYING…</span>
    fail_color = rgb(f38ba8) rgb(eba0ac) 30deg
    fail_text = <span foreground="##f38ba8"><b>▌ ACCESS DENIED</b> · strike $ATTEMPTS</span>
    capslock_color = rgb(f9e2af)
    numlock_color =
    swap_font_color = false
    position = 0, 34
    halign = center
    valign = center
    zindex = 2
}

# who / where / layout
label {
    monitor =
    text = cmd[update:0] echo "$($scripts/lockinfo host)  ·  $LAYOUT"
    color = $overlay
    font_size = 12
    font_family = $mono
    onclick = hyprctl switchxkblayout all next
    position = 0, -20
    halign = center
    valign = center
    zindex = 2
}

# ── hacker mode (only visible after a failed attempt; driven by lock-fx) ─────
label {
    monitor =
    text = cmd[update:0:1] $scripts/lock-fx log
    color = $subtext
    font_size = 12
    font_family = $mono
    text_align = left
    shadow_passes = 1
    position = 40, 78
    halign = left
    valign = bottom
    zindex = 5
}
label {
    monitor =
    text = cmd[update:0:1] $scripts/lock-fx stream
    color = $subtext
    font_size = 12
    font_family = $mono
    text_align = right
    shadow_passes = 1
    position = -40, 78
    halign = right
    valign = bottom
    zindex = 5
}

# ── status (bottom) ──────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:15000] echo "$($scripts/lockinfo battery)   $($scripts/lockinfo network)   󰇅 $($scripts/lockinfo host)"
    color = $subtext
    font_size = 16
    font_family = $mono
    shadow_passes = 1
    position = 40, 34
    halign = left
    valign = bottom
}
label {
    monitor =
    text = cmd[update:3000] $scripts/lockinfo media
    color = $subtext
    font_size = 16
    font_family = $mono
    shadow_passes = 1
    position = -40, 34
    halign = right
    valign = bottom
}
