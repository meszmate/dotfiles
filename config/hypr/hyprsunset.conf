# hyprsunset — blue-light filter schedule. Applies automatically at these
# times; SUPER+SHIFT+T (scripts/nightlight) forces it on/off manually.
# https://wiki.hypr.land/Hypr-Ecosystem/hyprsunset/

max-gamma = 150

profile {
    time = 7:30
    identity = true       # daytime: no filter
}

profile {
    time = 20:30
    temperature = 4800    # evening: warm
}

profile {
    time = 23:00
    temperature = 4200    # night: warmer
}
