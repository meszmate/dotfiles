[General]
# ── background ───────────────────────────────────────────────────────────────
# tree.png ships with the theme. setup/install-sddm-theme also copies the
# current desktop wallpaper next to it as wallpaper.jpg — set
# background=wallpaper.jpg to use that instead.
background=tree.png
# aspect | fill | tile | pad
backgroundFillMode=aspect
# Optional blur / dark dim of the whole background (0 = sharp, as shipped)
blurRadius=0
dim=0
# Soft ink-coloured shade tucked into the corners that hold text, so white
# text stays readable where the artwork is light. Strength 0–1 (0 = off) and
# which corners: tl, tr, bl, br (comma-separated; add tl for a full vignette).
cornerShade=0.4
cornerShadeCorners=tr,bl,br

# ── password field ───────────────────────────────────────────────────────────
# width as a fraction of the screen, height in px, corner radius in px
passwordInputWidth=0.25
passwordInputHeight=64
passwordInputRadius=32
# frosted glass behind the field: tint colour (with alpha) and backdrop blur
passwordInputBackground=#40ffffff
glassBlur=48
passwordCharacter=●
passwordMask=true
passwordFontSize=17
# Enter on an empty field is ignored instead of counting as a failed attempt
allowEmptyPassword=false
# ms the "wrong password" state stays before the field resets
failTimeout=2500

# ── text ─────────────────────────────────────────────────────────────────────
font=Inter
monoFont=JetBrainsMono Nerd Font
basicTextColor=#ffffff
# Dark halo painted behind the white text (0 = none, 1 = solid ink outline)
textHalo=0.6
# Show the user's full name (GECOS) instead of the login name
showRealName=true
clockFormat=HH:mm
dateFormat=dddd, d MMMM
hideCursor=false

# ── accents (picked from the artwork) ────────────────────────────────────────
# popups are light cards: ink = their text colour, accent = highlights
colorInk=#3b2145
colorAccent=#8a4fb3
colorRed=#d63a5a
colorYellow=#f2c94c
colorGreen=#3ea982
